<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화랑 세무회계 | 종합소득세 신고 서비스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary-color: #1a2a6c;
      --secondary-color: #b21f1f;
      --accent-color: #fdbb2d;
      --bg-dark: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    header { text-align: center; margin-bottom: 40px; margin-top: 20px; }
    header h1 { font-size: 2.5rem; font-weight: 800; background: linear-gradient(to right, #fff, var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
    
    .container { width: 100%; max-width: 600px; background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .form-header { margin-bottom: 30px; text-align: left; border-left: 4px solid var(--accent-color); padding-left: 15px; }
    .form-header h2 { font-size: 1.5rem; margin-bottom: 5px; }
    .form-header p { font-size: 0.9rem; color: #94a3b8; }

    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: #cbd5e1; }
    .input-group label span { color: #f87171; margin-left: 4px; font-size: 0.8rem; }
    input, select { width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: white; font-size: 1rem; transition: all 0.3s ease; }
    input:focus, select:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(253, 187, 45, 0.2); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .submit-btn { width: 100%; padding: 16px; background: linear-gradient(to right, #1a2a6c, #b21f1f); border: none; border-radius: 10px; color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .success-message { display: none; background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 0.9rem; text-align: center; }
    footer { margin-top: 50px; color: #64748b; font-size: 0.8rem; text-align: center; padding-bottom: 30px; }
  </style>
</head>
<body>

  <header>
    <h1>HWARANG TAX</h1>
    <p>당신의 든든한 세무 파트너, 화랑 세무회계</p>
  </header>

  <div class="container">
    <div class="form-header">
      <h2>신고 접수 신청</h2>
      <p>아래 정보를 입력해 주시면 담당 세무사가 빠른 시일 내 연락드립니다.</p>
    </div>

    <form id="taxForm">
      <div class="input-group">
        <label for="name">성함 <span>* 필수</span></label>
        <input type="text" id="name" placeholder="홍길동" required>
      </div>

      <div class="row">
        <div class="input-group">
          <label for="phone">연락처 <span>* 필수</span></label>
          <input type="tel" id="phone" placeholder="010-0000-0000" maxlength="13" required>
        </div>
        <div class="input-group">
          <label for="incomeType">소득 구분 <span>선택</span></label>
          <select id="incomeType">
            <option value="">선택해주세요</option>
            <option value="freelancer">사업소득(프리랜서)</option>
            <option value="business">사업소득(사업자)</option>
            <option value="salary">근로소득</option>
            <option value="extra">기타소득</option>
            <option value="multi">복수소득</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="income">수입금액 (연간) <span>* 필수</span></label>
        <input type="text" id="income" placeholder="예: 35,000,000원" required>
      </div>

      <button type="button" id="submitBtn" class="submit-btn" onclick="submitForm()">접수 완료 ✓</button>
